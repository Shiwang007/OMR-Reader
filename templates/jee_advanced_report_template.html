<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Advanced OMR Report | {{STUDENT_NAME}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ca8a04;
            --slate-50: #f8fafc;
            --slate-200: #e2e8f0;
            --slate-800: #1e293b;
        }

        * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            box-sizing: border-box;
        }

        @page {
            size: A4;
            margin: 0;
        }

        .theme-scorecard {
            font-family: 'Inter', sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 0;
            color: var(--slate-800);
            display: flex;
            justify-content: center;
            width: 100%;
            height: 297mm;
            max-height: 297mm;
            overflow: hidden;
            box-sizing: border-box;
        }

        .theme-scorecard .report-paper {
            background: white;
            width: 210mm;
            height: 297mm;
            max-height: 297mm;
            padding: 8mm 10mm;
            position: relative;
            z-index: 1;
            overflow: hidden;
            box-sizing: border-box;
        }

        .theme-scorecard .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.06;
            z-index: -1;
            pointer-events: none;
            width: 600px;
        }

        .theme-scorecard .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .theme-scorecard .student-info h1 {
            margin: 0;
            font-size: 20px;
            color: var(--slate-800);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .theme-scorecard .stats-summary {
            display: flex;
            gap: 15px;
        }

        .theme-scorecard .stat-item {
            text-align: center;
        }

        .theme-scorecard .stat-val {
            font-size: 16px;
            font-weight: 700;
            display: block;
        }

        .theme-scorecard .stat-lbl {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .theme-scorecard .divider {
            height: 1px;
            background: var(--slate-200);
            margin: 10px 0;
        }

        .theme-scorecard .subject-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .theme-scorecard .subject-col {
            border: 1px solid var(--slate-200);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .theme-scorecard .subject-title {
            background: var(--slate-50);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            color: var(--primary);
            border-bottom: 1px solid var(--slate-200);
            letter-spacing: 0.5px;
        }

        .theme-scorecard .table-flex {
            flex-grow: 1;
        }

        .theme-scorecard table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 10px;
        }

        .theme-scorecard th {
            background: #fff;
            color: #64748b;
            font-weight: 600;
            padding: 3px 2px;
            border-bottom: 1px solid var(--slate-200);
            font-size: 9px;
        }

        .theme-scorecard td {
            padding: 2.5px 2px;
            border-bottom: 1px dotted #e2e8f0;
        }

        .theme-scorecard th.q-num, .theme-scorecard td.q-num {
            font-weight: 600;
            color: #94a3b8;
            text-align: left;
            width: 28%;
            padding-left: 6px;
        }

        .theme-scorecard th.ans-cell, .theme-scorecard td.ans-cell {
            text-align: center;
            font-weight: 700;
            padding: 2.5px 1px;
            width: 36%;
        }

        .theme-scorecard .status-dot {
            display: inline-block;
            min-width: 16px;
            height: 16px;
            line-height: 16px;
            border-radius: 8px;
            padding: 0 4px;
            text-align: center;
            color: white !important;
            font-size: 8px;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .theme-scorecard .correct { background-color: var(--success); }
        .theme-scorecard .partial { background-color: #f59e0b; }
        .theme-scorecard .wrong { background-color: var(--danger); }
        .theme-scorecard .skipped { background-color: var(--slate-200); color: #64748b !important; }
        .theme-scorecard .invalid { background-color: #000; }

        .theme-scorecard .subject-footer {
            background: var(--slate-50);
            padding: 4px 1px;
            border-top: 1px solid var(--slate-200);
            font-size: 10px;
            text-align: center;
            font-weight: 700;
            color: var(--slate-800);
        }

        @media print {
            .theme-scorecard { background: white; padding: 0; height: 297mm; max-height: 297mm; overflow: hidden; page-break-inside: avoid; }
            .theme-scorecard .report-paper { box-shadow: none; border: none; width: 100%; height: 297mm; max-height: 297mm; overflow: hidden; page-break-inside: avoid; }
        }
    </style>
</head>
<body class="theme-scorecard">
    <div class="report-paper">
        <img src="{{LOGO_B64}}" class="watermark" alt="Medjeex Logo">
        <div class="header">
            <div class="student-info">
                <h1>{{STUDENT_NAME}}</h1>
                <p style="margin: 5px 0 0 0; font-size: 12px; color: #64748b;">{{EXAM_NAME}} &bull; {{DATE}}</p>
            </div>
            <div class="stats-summary">
                <div class="stat-item">
                    <span class="stat-val" style="color: var(--primary);">{{TOTAL_SCORE}}/{{TOTAL_MAX_SCORE}}</span>
                    <span class="stat-lbl">Score</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val">{{ATTEMPTED}}</span>
                    <span class="stat-lbl">Att</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" style="color: var(--success);">{{RIGHT}}</span>
                    <span class="stat-lbl">Right</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val" style="color: var(--danger);">{{WRONG}}</span>
                    <span class="stat-lbl">Wrong</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val">{{UNATTEMPTED}}</span>
                    <span class="stat-lbl">Unatt</span>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="subject-grid">
            {{SUBJECT_GRID}}
        </div>
    </div>
</body>
</html>
